<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade 🕹️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #050510; }

    @keyframes float-blob {
      0%, 100% { transform: translate(0,0) scale(1); }
      33%       { transform: translate(18px,-18px) scale(1.1); }
      66%       { transform: translate(-12px,14px) scale(0.9); }
    }
    .blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.12; animation:float-blob 10s ease-in-out infinite; pointer-events:none; }

    @keyframes hit-pulse {
      0%,100% { box-shadow:0 0 8px #ffd700,0 0 16px #ffd70050,inset 0 0 6px #ffd70020; border-color:rgba(255,215,0,.8); }
      50%      { box-shadow:0 0 18px #ffd700,0 0 38px #ffd700,inset 0 0 14px #ffd70040; border-color:rgba(255,215,0,1); }
    }
    .hit-zone { animation:hit-pulse 1.4s ease-in-out infinite; }

    .note-0 { background:linear-gradient(135deg,#ff66cc,#cc00ff); box-shadow:0 0 14px #ff00ff,0 0 28px #ff00ff50; }
    .note-1 { background:linear-gradient(135deg,#00eeff,#0055ff); box-shadow:0 0 14px #00ffff,0 0 28px #00ffff50; }
    .note-2 { background:linear-gradient(135deg,#00ff88,#00bb44); box-shadow:0 0 14px #00ff88,0 0 28px #00ff8850; }
    .note-3 { background:linear-gradient(135deg,#ffaa00,#ff3300); box-shadow:0 0 14px #ff8800,0 0 28px #ff880050; }

    .gbtn { border:none; cursor:pointer; transition:transform .08s ease,box-shadow .08s ease; }
    .gbtn-0 { background:linear-gradient(160deg,#ff66cc,#aa00dd); box-shadow:0 4px 20px #ff00ff40; }
    .gbtn-1 { background:linear-gradient(160deg,#00eeff,#0055cc); box-shadow:0 4px 20px #00ffff40; }
    .gbtn-2 { background:linear-gradient(160deg,#00ff88,#009933); box-shadow:0 4px 20px #00ff8840; }
    .gbtn-3 { background:linear-gradient(160deg,#ffaa00,#cc2200); box-shadow:0 4px 20px #ff880040; }
    .gbtn-0.pressed { transform:scale(.90); box-shadow:0 0 40px #ff00ff,0 0 80px #ff00ff50; }
    .gbtn-1.pressed { transform:scale(.90); box-shadow:0 0 40px #00ffff,0 0 80px #00ffff50; }
    .gbtn-2.pressed { transform:scale(.90); box-shadow:0 0 40px #00ff88,0 0 80px #00ff8850; }
    .gbtn-3.pressed { transform:scale(.90); box-shadow:0 0 40px #ff8800,0 0 80px #ff880050; }

    @keyframes float-up { 0%{opacity:1;transform:translateY(0) scale(1.1)} 100%{opacity:0;transform:translateY(-60px) scale(.8)} }
    .hit-text { position:absolute; font-family:'Orbitron',sans-serif; font-size:.72rem; font-weight:900; pointer-events:none; animation:float-up .75s ease-out forwards; z-index:20; text-align:center; width:80px; letter-spacing:.03em; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    .shaking { animation:shake .35s ease-out; }

    @keyframes combo-pop { 0%{transform:scale(1.7)} 100%{transform:scale(1)} }
    .combo-pop { animation:combo-pop .18s ease-out; }

    .scanlines { background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.04) 3px,rgba(0,0,0,.04) 6px); pointer-events:none; }
    .score-text { font-family:'Orbitron',sans-serif; color:#ffd700; text-shadow:0 0 12px #ffd700,0 0 24px #ffd70060; }
    .neon-title { font-family:'Orbitron',sans-serif; color:#ff88ff; text-shadow:0 0 10px #ff00ff,0 0 22px #ff00ff60; }

    @keyframes lane-flash { 0%{opacity:.5} 100%{opacity:0} }
    .lane-flash-anim { animation:lane-flash .15s ease-out; }
    .speed-fill { transition:width .4s ease; }

    @keyframes note-appear { from{opacity:0;transform:scaleY(.5)} to{opacity:1;transform:scaleY(1)} }
    .note-appear { animation:note-appear .12s ease-out; }

    @keyframes card-glow {
      0%,100% { box-shadow:0 0 20px var(--clr),0 0 40px rgba(255,255,255,0.16); }
      50%      { box-shadow:0 0 35px var(--clr),0 0 70px rgba(255,255,255,0.24); }
    }
    .game-card { cursor:pointer; transition:transform .15s ease; }
    .game-card:active { transform:scale(.94); }

    .dpad-btn { cursor:pointer; border:none; transition:transform .08s ease,background .08s ease; }
    .dpad-btn:active { transform:scale(.86); }

    /* Plein écran : pas de coupure */
    :fullscreen #root, :-webkit-full-screen #root {
      height: 100dvh; overflow: hidden;
    }
    :fullscreen canvas, :-webkit-full-screen canvas {
      width: 100% !important; height: 100% !important;
    }
  </style>
</head>
<body class="m-0 p-0">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useState, useRef } = React;

    const LABELS      = ['🌟','💎','🍀','🔥'];
    const GLOW_COLORS = ['#ff00ff','#00ffff','#00ff88','#ff8800'];
    const SN_COLS = 20, SN_ROWS = 20, SN_CS = 400;

    // ── Audio ────────────────────────────────────────────────────────────────
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playTone(freq, type, vol, dur) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.type = type;
        g.gain.setValueAtTime(vol, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch(e) {}
    }
    function playHit(lane)  { playTone([880,660,550,440][lane], 'sine', .22, .16); }
    function playMiss()     { playTone(110, 'sawtooth', .12, .24); }
    function playEat()      {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + .08);
        g.gain.setValueAtTime(.18, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .2);
        osc.start(); osc.stop(ctx.currentTime + .2);
      } catch(e) {}
    }
    function playDie() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + .4);
        g.gain.setValueAtTime(.2, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .5);
        osc.start(); osc.stop(ctx.currentTime + .5);
      } catch(e) {}
    }


    function randomId() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }

    // ── Canvas helper ────────────────────────────────────────────────────────
    function rrect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
      ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
      ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
      ctx.closePath();
    }

    // ── Fullscreen helper ─────────────────────────────────────────────────────
    function FullscreenBtn() {
      const [fs, setFs] = React.useState(!!document.fullscreenElement);
      React.useEffect(() => {
        const handler = () => setFs(!!document.fullscreenElement);
        document.addEventListener('fullscreenchange', handler);
        return () => document.removeEventListener('fullscreenchange', handler);
      }, []);
      function toggle() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      return (
        <button onClick={toggle}
          style={{ position:'fixed', top:'10px', right:'12px', zIndex:9999, background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:'8px', color:'#aaa', padding:'5px 10px', cursor:'pointer', fontFamily:'Orbitron,sans-serif', fontSize:'.6rem', letterSpacing:'.05em', backdropFilter:'blur(4px)' }}>
          {fs ? '⊠ EXIT' : '⛶ FULL'}
        </button>
      );
    }

    // ── Menu ─────────────────────────────────────────────────────────────────
    function MenuScreen({ onSelect }) {
      return (
        <div className="min-h-screen w-full flex flex-col items-center justify-center px-4 select-none"
             style={{ background:'radial-gradient(ellipse at 50% -10%,#1e0040 0%,#050510 55%)', position:'relative', overflow:'hidden' }}>
          <div className="blob" style={{ width:220,height:220,background:'#ff00ff',top:-60,left:-60 }}/>
          <div className="blob" style={{ width:170,height:170,background:'#00ffff',bottom:70,right:-40,animationDelay:'3.5s' }}/>
          <div className="blob" style={{ width:120,height:120,background:'#00ff88',top:'45%',left:'35%',animationDelay:'6.5s' }}/>

          <p className="text-5xl mb-3 z-10" style={{ filter:'drop-shadow(0 0 20px #ff88ff)' }}>🕹️</p>
          <h1 className="z-10 mb-1" style={{ fontFamily:'Orbitron,sans-serif', fontSize:'2.4rem', fontWeight:900, color:'#ff88ff', textShadow:'0 0 16px #ff00ff,0 0 36px #ff00ff60', letterSpacing:'.2em' }}>ARCADE</h1>
          <p className="text-slate-500 mb-8 z-10" style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.6rem', letterSpacing:'.2em' }}>CHOISIS TON JEU</p>

          <div className="w-full max-w-full lg:max-w-3xl grid grid-cols-2 gap-4 z-10">
            <button onClick={() => { getAudio(); onSelect('neonbeat'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#ff00ff', borderColor:'rgba(255,0,255,0.35)', background:'rgba(255,0,255,0.06)', animation:'card-glow 2.5s ease-in-out infinite' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #ff00ff)' }}>⚡</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#ff88ff', textShadow:'0 0 8px #ff00ff', letterSpacing:'.08em' }}>NEON BEAT</span>
              <span className="text-slate-500 mt-2 text-center" style={{ fontSize:'.65rem', lineHeight:'1.4' }}>Frappe les notes au bon moment !</span>
            </button>

            <button onClick={() => { getAudio(); onSelect('snake'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#ff88ff', borderColor:'rgba(255,136,255,0.35)', background:'rgba(255,136,255,0.06)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'.9s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #ff88ff)' }}>📿</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#ff88ff', textShadow:'0 0 8px #ff88ff', letterSpacing:'.08em' }}>PERLES</span>
              <span className="text-slate-500 mt-2 text-center" style={{ fontSize:'.65rem', lineHeight:'1.4' }}>Guide le collier pour attraper les perles !</span>
            </button>

            <button onClick={() => { getAudio(); onSelect('dog'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#ffd700', borderColor:'rgba(255,209,0,0.35)', background:'rgba(255,209,0,0.08)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'1.6s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #ffd700)' }}>🤖🐶</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#ffd700', textShadow:'0 0 8px #ffd700', letterSpacing:'.08em' }}>DOG RUN</span>
              <span className="text-slate-500 mt-2 text-center" style={{ fontSize:'.65rem', lineHeight:'1.4' }}>Saute les obstacles et collecte les os !</span>
            </button>

            <button onClick={() => { getAudio(); onSelect('pirate'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#22d3ee', borderColor:'rgba(34,211,238,0.35)', background:'rgba(34,211,238,0.08)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'2.3s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #22d3ee)' }}>🏴‍☠️⚓</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#22d3ee', textShadow:'0 0 8px #22d3ee', letterSpacing:'.08em' }}>PIRATE FIRE</span>
              <span className="text-slate-500 mt-2 text-center" style={{ fontSize:'.65rem', lineHeight:'1.4' }}>Vise et coule les navires ennemis !</span>
            </button>

            <button onClick={() => { getAudio(); onSelect('candy'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#38d4ff', borderColor:'rgba(56,212,255,0.35)', background:'rgba(56,212,255,0.08)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'3s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #38d4ff)' }}>🍬👧</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#38d4ff', textShadow:'0 0 8px #38d4ff', letterSpacing:'.08em' }}>CANDY DASH</span>
              <span className="text-slate-500 mt-2 text-center" style={{ fontSize:'.65rem', lineHeight:'1.4' }}>Glisse le bonbon et échappe aux enfants !</span>
            </button>

            <button onClick={() => { getAudio(); onSelect('cannonbreak'); }}
                    className="game-card flex flex-col items-center py-7 px-3 rounded-2xl border-2"
                    style={{ '--clr':'#ffd700', borderColor:'rgba(255,215,0,0.35)', background:'rgba(255,215,0,0.08)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'3.7s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #ffd700)' }}>💣🏴‍☠️</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#ffd700', textShadow:'0 0 8px #ffd700', letterSpacing:'.08em' }}>CANON BREAK</span>

            <button onClick={() => { getAudio(); onSelect('chattraque'); }}

                    style={{ '--clr':'#aa55ff', gridColumn:'1 / -1', maxWidth:'50%', margin:'0 auto', width:'100%', borderColor:'rgba(170,85,255,0.35)', background:'rgba(170,85,255,0.07)', animation:'card-glow 2.5s ease-in-out infinite', animationDelay:'4.4s' }}>
              <span className="text-4xl mb-3" style={{ filter:'drop-shadow(0 0 14px #aa55ff)' }}>🐱🐕</span>
              <span style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.88rem', fontWeight:900, color:'#bb88ff', textShadow:'0 0 8px #aa55ff', letterSpacing:'.08em' }}>FUITE FÉLINE</span>

          <p className="z-10 mt-8" style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.5rem', letterSpacing:'.12em', color:'#333', textAlign:'center' }}>

          </p>

    }

    // ── Neon Beat ─────────────────────────────────────────────────────────────
    function RhythmGame({ onBack }) {
      const [notes,       setNotes]       = useState([]);
      const [score,       setScore]       = useState(0);
      const [lives,       setLives]       = useState(5);
      const [combo,       setCombo]       = useState(0);
      const [maxCombo,    setMaxCombo]    = useState(0);
      const [gameOver,    setGameOver]    = useState(false);
      const [started,     setStarted]     = useState(false);
      const [pressedLane, setPressedLane] = useState(null);
      const [speed,       setSpeed]       = useState(1);
      const [feedbacks,   setFeedbacks]   = useState([]);
      const [laneFlash,   setLaneFlash]   = useState(null);
      const [shaking,     setShaking]     = useState(false);
      const [comboAnim,   setComboAnim]   = useState(false);

      const notesRef = useRef([]);
      const comboRef = useRef(0);
      const lastHitLaneRef = useRef(null);
      useEffect(() => { notesRef.current = notes; }, [notes]);
      useEffect(() => { comboRef.current = combo;  }, [combo]);

      // vitesse monte lentement
      useEffect(() => {
        if (!started || gameOver) return;
        const t = setInterval(() => setSpeed(s => Math.min(2.4, s + 0.07)), 3500);
        return () => clearInterval(t);
      }, [started, gameOver]);

      // spawn — intervalle plus long au début
      useEffect(() => {
        if (!started || gameOver) return;
        const delay = Math.max(420, 1500 - (speed - 1) * 420);
        const t = setInterval(() => {
          const note = { id:randomId(), lane:Math.floor(Math.random()*4), y:0, fresh:true };
          setNotes(p => { const n=[...p,note]; notesRef.current=n; return n; });
          setTimeout(() => setNotes(p => p.map(n => n.id===note.id ? {...n,fresh:false} : n)), 130);
        }, delay);
        return () => clearInterval(t);
      }, [started, gameOver, speed]);

      // chute — plus lente au début
      useEffect(() => {
        if (!started || gameOver) return;
        const step = 2.0 + (speed - 1) * 2.2;
        const interval = Math.max(22, 40 - (speed - 1) * 8);
        const t = setInterval(() => {
          setNotes(prev => {
            let missed = 0;
            const next = prev.reduce((acc, n) => {
              const moved = {...n, y:n.y+step};
              if (moved.y > 96) missed++;
              else acc.push(moved);
              return acc;
            }, []);
            notesRef.current = next;
            if (missed > 0) {
              setLives(l => { const nl=Math.max(0,l-missed); if(nl<=0) setGameOver(true); return nl; });
              comboRef.current = 0; setCombo(0);
              setShaking(true); setTimeout(() => setShaking(false), 360);
              for (let i=0;i<missed;i++) playMiss();
            }
            return next;
          });
        }, interval);
        return () => clearInterval(t);
      }, [started, gameOver, speed]);

      function addFb(lane, text, color) {
        const id = randomId();
        setFeedbacks(p => [...p,{id,lane,text,color}]);
        setTimeout(() => setFeedbacks(p => p.filter(f => f.id!==id)), 780);
      }

      function hitLane(i) {
        if (!started || gameOver) return;
        if (lastHitLaneRef.current === i) return;
        lastHitLaneRef.current = i;
        setTimeout(() => { lastHitLaneRef.current = null; }, 50);
        getAudio(); setPressedLane(i); setLaneFlash(i);
        setTimeout(() => { setPressedLane(null); setLaneFlash(null); }, 130);
        const hit = notesRef.current.find(n => n.lane===i && n.y>67 && n.y<96);
        if (hit) {
          const nc = comboRef.current + 1; comboRef.current = nc;
          const mult = nc>=20?3:nc>=10?2:nc>=5?1.5:1;
          setNotes(p => { const n=p.filter(x=>x.id!==hit.id); notesRef.current=n; return n; });
          setCombo(nc); setMaxCombo(m=>Math.max(m,nc)); setScore(s=>s+Math.round(10*mult));
          setComboAnim(true); setTimeout(()=>setComboAnim(false),200);
          const lbl = nc>=20?'⚡ PARFAIT!':nc>=10?'✨ SUPER!':nc>=5?'🔥 BIEN!':'👍 OK';
          addFb(i, lbl, nc>=20?'#ffd700':nc>=10?'#ff00ff':nc>=5?'#00ffff':'#ffffff');
          playHit(i);
        } else {
          // Trop tôt ou mauvaise case : on coupe le combo mais pas de vie perdue
          comboRef.current = 0; setCombo(0);
        }
      }

      function restart() {
        notesRef.current=[]; comboRef.current=0;
        setNotes([]); setScore(0); setLives(5); setCombo(0); setMaxCombo(0);
        setGameOver(false); setSpeed(1); setFeedbacks([]); setStarted(true);
      }

      const mult     = combo>=20?3:combo>=10?2:combo>=5?1.5:1;
      const speedPct = Math.round(((speed-1)/1.4)*100);
      const speedClr = speed>2?'#ff3333':speed>1.5?'#ff8800':'#00ff88';
      const speedLbl = speed>2?'DANGER !':speed>1.5?'RAPIDE':'NORMAL';

      return (
        <div className="min-h-screen w-full flex flex-col items-center justify-start px-3 py-4 select-none touch-none overflow-hidden"
             style={{ background:'radial-gradient(ellipse at 50% -10%,#1e0040 0%,#050510 55%)', position:'relative' }}>
          <div className="blob" style={{ width:220,height:220,background:'#ff00ff',top:-60,left:-60 }}/>
          <div className="blob" style={{ width:170,height:170,background:'#00ffff',bottom:70,right:-40,animationDelay:'3.5s' }}/>
          <div className="blob" style={{ width:120,height:120,background:'#00ff88',top:'45%',left:'35%',animationDelay:'6.5s' }}/>

          <div className="w-full max-w-full lg:max-w-3xl flex items-start justify-between mb-3 z-10">
            <div>

    // ── Collier de Perles ────────────────────────────────────────────────────
    // Couleurs arc-en-ciel qui tournent le long du collier
    function pearlHue(idx, total) { return (idx * (360 / Math.max(total, 12))) % 360; }

    function SnakeGame({ onBack }) {
      const IS = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      const IF = {x:15,y:10};

      const [snake,     setSnake]     = useState(IS);
      const [food,      setFood]      = useState(IF);
      const [score,     setScore]     = useState(0);
      const [gameOver,  setGameOver]  = useState(false);
      const [started,   setStarted]   = useState(false);
      const [tickMs,    setTickMs]    = useState(270);
      const [pearlCount,setPearlCount]= useState(0);
      const [pulse,     setPulse]     = useState(0);

      const canvasRef   = useRef(null);
      const snakeRef    = useRef(IS);
      const foodRef     = useRef(IF);
      const dirRef      = useRef({x:1,y:0});
      const scoreRef    = useRef(0);
      const prlCntRef   = useRef(0);
      const goRef       = useRef(false);

      // Pulse pour la perle à attraper
      useEffect(() => {
        const t = setInterval(() => setPulse(p => p + 1), 50);
        return () => clearInterval(t);
      }, []);

      // Dessin canvas — collier de perles
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const cs = SN_CS / SN_COLS;

        // Fond
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, SN_CS, SN_CS);

        // Grille discrète
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 0.5;
        for (let i=0; i<=SN_COLS; i++) {
          ctx.beginPath(); ctx.moveTo(i*cs,0); ctx.lineTo(i*cs,SN_CS); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,i*cs); ctx.lineTo(SN_CS,i*cs); ctx.stroke();
        }

        const total = snake.length;

        // Fil du collier (dessiné avant les perles)
        if (total > 1) {
          ctx.save();
          ctx.strokeStyle = 'rgba(220,200,255,0.25)';
          ctx.lineWidth = 1.5;
          ctx.lineCap = 'round';
          ctx.setLineDash([2, 4]);
          ctx.beginPath();
          snake.forEach((seg, idx) => {
            const cx = seg.x*cs + cs/2, cy = seg.y*cs + cs/2;
            idx === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
          });
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        // Perle à attraper — dorée et pulsante
        const f = food;
        const pulseFactor = 0.85 + 0.15 * Math.sin(pulse * 0.35);
        const fR = (cs/2 - 1) * pulseFactor;
        const fx = f.x*cs + cs/2, fy = f.y*cs + cs/2;
        ctx.save();
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur  = 10 + 14 * Math.abs(Math.sin(pulse * 0.35));
        const fGrad = ctx.createRadialGradient(fx - fR*0.35, fy - fR*0.35, 0, fx, fy, fR);
        fGrad.addColorStop(0,   '#fff8e0');
        fGrad.addColorStop(0.35,'#ffd700');
        fGrad.addColorStop(0.75,'#ffaa00');
        fGrad.addColorStop(1,   '#cc6600');
        ctx.fillStyle = fGrad;
        ctx.beginPath(); ctx.arc(fx, fy, fR, 0, Math.PI*2); ctx.fill();
        // reflet
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.arc(fx - fR*0.32, fy - fR*0.32, fR*0.2, 0, Math.PI*2); ctx.fill();
        ctx.restore();

        // Perles du collier
        snake.forEach((seg, idx) => {
          const cx = seg.x*cs + cs/2, cy = seg.y*cs + cs/2;
          const isHead = idx === 0;
          const r = isHead ? cs/2 - 1 : cs/2 - 2.5;
          const hue = pearlHue(idx, total);

          ctx.save();
          ctx.shadowColor = `hsl(${hue},100%,65%)`;
          ctx.shadowBlur  = isHead ? 22 : 9;

          const grad = ctx.createRadialGradient(cx - r*0.35, cy - r*0.35, 0, cx, cy, r);
          grad.addColorStop(0,   `hsl(${hue},60%,90%)`);
          grad.addColorStop(0.45,`hsl(${hue},100%,65%)`);
          grad.addColorStop(0.8, `hsl(${hue},100%,40%)`);
          grad.addColorStop(1,   `hsl(${hue},100%,22%)`);
          ctx.fillStyle = grad;
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

          // reflet principal
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.beginPath(); ctx.arc(cx - r*0.32, cy - r*0.33, r*(isHead?0.22:0.18), 0, Math.PI*2); ctx.fill();

          // petit reflet secondaire
          ctx.fillStyle = 'rgba(255,255,255,0.18)';
          ctx.beginPath(); ctx.arc(cx + r*0.28, cy + r*0.28, r*0.1, 0, Math.PI*2); ctx.fill();

          // contour léger
          ctx.strokeStyle = `hsla(${hue},100%,80%,0.35)`;
          ctx.lineWidth = 0.8;
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

          ctx.restore();
        });
      }, [snake, food, pulse]);

      function spawnFood(snk) {
        let pos;
        do { pos = { x:Math.floor(Math.random()*SN_COLS), y:Math.floor(Math.random()*SN_ROWS) }; }
        while (snk.some(s => s.x===pos.x && s.y===pos.y));
        return pos;
      }

      function changeDir(dx, dy) {
        if (dx!==0 && dirRef.current.x!==0) return;
        if (dy!==0 && dirRef.current.y!==0) return;
        dirRef.current = {x:dx, y:dy};
      }

      useEffect(() => {
        const h = e => {
          const m = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
          if (m[e.key]) { e.preventDefault(); changeDir(...m[e.key]); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, []);

      useEffect(() => {
        if (!started || gameOver) return;
        const t = setInterval(() => {
          if (goRef.current) return;
          const snk = snakeRef.current;
          const d   = dirRef.current;
          const head = { x:(snk[0].x+d.x+SN_COLS)%SN_COLS, y:(snk[0].y+d.y+SN_ROWS)%SN_ROWS };

          if (snk.some(s => s.x===head.x && s.y===head.y)) {
            goRef.current = true; setGameOver(true); playDie(); return;
          }

          const f = foodRef.current;
          let ns;
          if (head.x===f.x && head.y===f.y) {
            ns = [head, ...snk];
            const newSc = scoreRef.current + 10;
            const newPc = prlCntRef.current + 1;
            scoreRef.current = newSc; prlCntRef.current = newPc;
            setScore(newSc); setPearlCount(newPc);
            const nf = spawnFood(ns); foodRef.current = nf; setFood(nf);
            if (newPc % 3 === 0) setTickMs(prev => Math.max(100, prev-20));
            playEat();
          } else {
            ns = [head, ...snk.slice(0,-1)];
          }
          snakeRef.current = ns;
          setSnake([...ns]);
        }, tickMs);
        return () => clearInterval(t);
      }, [started, gameOver, tickMs]);

      function restart() {
        snakeRef.current = IS; foodRef.current = IF;
        dirRef.current = {x:1,y:0}; scoreRef.current = 0;
        prlCntRef.current = 0; goRef.current = false;
        setSnake([...IS]); setFood({...IF}); setScore(0); setPearlCount(0);
        setGameOver(false); setTickMs(270); setStarted(true);
      }

      const dBtn = {
        height:'72px', width:'100%',
        background:'rgba(255,136,255,0.10)', border:'2px solid rgba(255,136,255,0.22)',
        borderRadius:'14px', color:'#ff88ff', fontSize:'1.9rem'
      };

      return (
        <div className="w-full flex flex-col items-center justify-start px-3 py-4 select-none touch-none overflow-hidden"
             style={{ height:'100dvh', background:'radial-gradient(ellipse at 50% 0%,#1a0030 0%,#050510 60%)', position:'relative' }}>
          <div className="blob" style={{ width:200,height:200,background:'#ff00ff',top:-80,right:-60 }}/>
          <div className="blob" style={{ width:160,height:160,background:'#0088ff',bottom:120,left:-50,animationDelay:'3s' }}/>
          <div className="blob" style={{ width:120,height:120,background:'#ffd700',top:'40%',left:'60%',animationDelay:'6s' }}/>

          <div className="w-full max-w-full lg:max-w-3xl flex items-center justify-between mb-3 z-10">
            <button onClick={onBack} style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.58rem', letterSpacing:'.05em', color:'#666', border:'1px solid rgba(255,255,255,0.08)', background:'rgba(255,255,255,0.03)', borderRadius:'8px', padding:'4px 10px', cursor:'pointer' }}>
              ← MENU
            </button>
            <div style={{ textAlign:'right' }}>
              <div style={{ fontFamily:'Orbitron,sans-serif', color:'#ff88ff', textShadow:'0 0 12px #ff00ff', fontSize:'1.8rem', fontWeight:900, lineHeight:1 }}>{score}</div>
              <div style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.56rem', color:'#555', letterSpacing:'.1em' }}>💎 {pearlCount} perle{pearlCount!==1?'s':''}</div>
            </div>
          </div>

          <div className="w-full max-w-full lg:max-w-3xl z-10" style={{ flex:1, minHeight:0, position:'relative', display:'flex', alignItems:'center', justifyContent:'center' }}>
            <canvas ref={canvasRef} width={SN_CS} height={SN_CS}
                    style={{ maxWidth:'100%', maxHeight:'100%', aspectRatio:'1', borderRadius:'16px', display:'block', border:'1px solid rgba(255,136,255,0.15)', boxShadow:'0 0 40px rgba(255,0,255,.1),0 20px 60px rgba(0,0,0,.8)' }}/>

            {!started && !gameOver && (
              <div className="absolute inset-0 flex flex-col items-center justify-center rounded-2xl"
                   style={{ background:'rgba(4,4,14,.92)', backdropFilter:'blur(6px)' }}>
                <p className="text-5xl mb-3" style={{ filter:'drop-shadow(0 0 20px #ff88ff)' }}>📿</p>
                <h2 style={{ fontFamily:'Orbitron,sans-serif', color:'#ff88ff', textShadow:'0 0 20px #ff00ff', fontSize:'1.8rem', fontWeight:900, marginBottom:'.4rem', letterSpacing:'.08em' }}>COLLIER DE PERLES</h2>
                <p className="text-slate-400 text-center text-sm mb-5 px-8 leading-relaxed">
                  Guide le collier pour attraper<br/>les perles dorées ✨
                </p>
                <button onClick={restart}
                        className="rounded-full px-10 py-4 text-xl font-black text-white"
                        style={{ background:'linear-gradient(135deg,#ff44aa,#aa00ff)', boxShadow:'0 0 30px #ff00ff,0 0 60px #ff00ff40', fontFamily:'Orbitron,sans-serif' }}>
                  JOUER ▶
                </button>
              </div>
            )}

            {gameOver && (
              <div className="absolute inset-0 flex flex-col items-center justify-center rounded-2xl"
                   style={{ background:'rgba(4,4,14,.92)', backdropFilter:'blur(6px)' }}>
                <p className="text-4xl mb-2">💔</p>
                <h2 style={{ fontFamily:'Orbitron,sans-serif', color:'#ff3366', textShadow:'0 0 20px #ff3366', fontSize:'2rem', fontWeight:900, marginBottom:'.2rem' }}>CASSÉ !</h2>
                <p style={{ fontFamily:'Orbitron,sans-serif', color:'#ff88ff', fontSize:'2.2rem', fontWeight:900, marginBottom:'.2rem' }}>{score}</p>
                <p style={{ fontFamily:'Orbitron,sans-serif', color:'#555', fontSize:'.62rem', letterSpacing:'.1em', marginBottom:'1.4rem' }}>💎 PERLES : {pearlCount}</p>
                <button onClick={restart}
                        className="rounded-full px-10 py-4 text-xl font-black text-white"
                        style={{ background:'linear-gradient(135deg,#ff44aa,#aa00ff)', boxShadow:'0 0 30px #ff00ff', fontFamily:'Orbitron,sans-serif' }}>
                  REJOUER ▶
                </button>
              </div>
            )}
          </div>

          <div className="mt-3 z-10" style={{ display:'grid', gridTemplateColumns:'repeat(3,76px)', gridTemplateRows:'repeat(3,76px)', gap:'6px' }}>
            <div/>
            <button className="dpad-btn" onPointerDown={() => changeDir(0,-1)} onMouseDown={() => changeDir(0,-1)} onTouchStart={(e) => { e.preventDefault(); changeDir(0,-1); }} style={dBtn}>▲</button>
            <div/>
            <button className="dpad-btn" onPointerDown={() => changeDir(-1,0)} onMouseDown={() => changeDir(-1,0)} onTouchStart={(e) => { e.preventDefault(); changeDir(-1,0); }} style={dBtn}>◀</button>
            <div style={{ ...dBtn, background:'rgba(255,136,255,0.03)', border:'2px solid rgba(255,136,255,0.07)', cursor:'default' }}/>
            <button className="dpad-btn" onPointerDown={() => changeDir(1,0)} onMouseDown={() => changeDir(1,0)} onTouchStart={(e) => { e.preventDefault(); changeDir(1,0); }}  style={dBtn}>▶</button>
            <div/>
            <button className="dpad-btn" onPointerDown={() => changeDir(0,1)} onMouseDown={() => changeDir(0,1)} onTouchStart={(e) => { e.preventDefault(); changeDir(0,1); }}  style={dBtn}>▼</button>
            <div/>
          </div>
        </div>
      );
    }

    function DogGame({ onBack }) {
      const [started, setStarted] = useState(false);
      const [gameOver, setGameOver] = useState(false);
      const [score, setScore] = useState(0);
      const [lives, setLives] = useState(3);
      const [speed, setSpeed] = useState(1);
      const [playerY, setPlayerY] = useState(0);
      const [message, setMessage] = useState('Appuie sur SAUTER pour esquiver les obstacles.');
      const [obstacles, setObstacles] = useState([]);
      const [bones, setBones] = useState(0);
      const [jumping, setJumping] = useState(false);
      const [jumpCount, setJumpCount] = useState(0);
      const [doubleJumpReady, setDoubleJumpReady] = useState(false);

      const obsRef = useRef([]);
      const playerYRef = useRef(0);
      const velRef = useRef(0);
      const speedRef = useRef(1);
      const livesRef = useRef(3);
      const jumpCountRef = useRef(0);
      const doubleJumpRef = useRef(false);

      useEffect(() => { obsRef.current = obstacles; }, [obstacles]);
      useEffect(() => { speedRef.current = speed; }, [speed]);
      useEffect(() => { livesRef.current = lives; }, [lives]);
      useEffect(() => { jumpCountRef.current = jumpCount; }, [jumpCount]);
      useEffect(() => { doubleJumpRef.current = doubleJumpReady; }, [doubleJumpReady]);

      function addMessage(text) {
        setMessage(text);
        setTimeout(() => { setMessage(''); }, 1400);
      }

      function start() {
        obsRef.current = [];
        playerYRef.current = 0;
        velRef.current = 0;
        livesRef.current = 3;
        setObstacles([]);
        setScore(0);
        setLives(3);
        setSpeed(1);
        setPlayerY(0);
        setBones(0);
        setJumping(false);
        setJumpCount(0);
        jumpCountRef.current = 0;
        setDoubleJumpReady(false);
        doubleJumpRef.current = false;
        setMessage('Saute les obstacles ! Attrape un os pour le double saut.');
        setGameOver(false);
        setStarted(true);
      }

      function jump() {
        if (!started || gameOver || jumpCountRef.current >= 1) return;
        jumpCountRef.current = 1;
        velRef.current = 0.45;
        setJumping(true);
        setJumpCount(1);
      }

      function doubleJump() {
        if (!started || gameOver || !doubleJumpRef.current) return;
        jumpCountRef.current = 2;
        velRef.current = 0.78;
        doubleJumpRef.current = false;
        setDoubleJumpReady(false);
        setJumping(true);
        setJumpCount(2);
      }

      useEffect(() => {
        if (!started || gameOver) return;
        const t = setInterval(() => {
          let y = playerYRef.current;
          let v = velRef.current;
          v -= 0.027;
          y += v;
          if (y <= 0) {
            y = 0;
            v = 0;
            if (jumping) setJumping(false);
            if (jumpCountRef.current !== 0) {
              setJumpCount(0);
              jumpCountRef.current = 0;
            }
          }
          playerYRef.current = y;
          velRef.current = v;
          setPlayerY(y);

          const next = [];
          const dogJump = y > 0.28;
          obsRef.current.forEach(o => {
            const nextX = o.x - (1.8 + speedRef.current * 0.28);
            if (nextX < -18) return;
            const inHitZone = nextX < 18 && nextX > 12;
            if (inHitZone) {
              if (o.type === 'rock') {
                if (!dogJump) {
                  setLives(l => Math.max(0, l - 1));
                  playMiss();
                  addMessage('Oups ! Obstacle touché.');
                  if (livesRef.current <= 1) {
                    setGameOver(true);
                    playDie();
                  }
                }
                return;
              }
              if (o.type === 'bone' && dogJump) {
                setScore(s => s + 34);
                setBones(b => b + 1);
                playEat();
                doubleJumpRef.current = true;
                setDoubleJumpReady(true);
                addMessage('🦴 Double saut chargé !');
                return;

              if (o.type === 'cursed' && dogJump) {
                setScore(s => s + 12);
                setSpeed(s => Math.min(2.8, s + 0.35));
                playMiss();
                addMessage('Os maudit ! Vitesse accélère');
                return;
              }
            }
            next.push({ ...o, x: nextX });
          });
          obsRef.current = next;
          setObstacles(next);
        }, 30);
        return () => clearInterval(t);
      }, [started, gameOver, jumping]);

      useEffect(() => { posRef.current = position; }, [position]);
      useEffect(() => { scoreRef.current = score; }, [score]);
      useEffect(() => { livesRef.current = lives; }, [lives]);
      useEffect(() => { activeRef.current = active; }, [active]);

      function reset() {
        setStarted(true);
        setGameOver(false);
        setScore(0);
        setLives(3);
        setPosition(50);
        posRef.current = 50;
        setObstacles([]);
        setMessage("Glisse le bonbon avec le doigt, évite les enfants affamés !");
      }

      function setX(clientX) {
        const rect = areaRef.current?.getBoundingClientRect();
        if (!rect) return;
        const percent = Math.min(94, Math.max(6, ((clientX - rect.left) / rect.width) * 100));
        setPosition(percent);

      function handleMove(e) {
        if (!activeRef.current) return;
        setX(e.clientX || (e.touches && e.touches[0]?.clientX));
      }

      useEffect(() => {
        if (!started || gameOver) return;
        const interval = setInterval(() => {
          setScore(prev => prev + 1);
        }, 220);
        return () => clearInterval(interval);
      }, [started, gameOver]);

      useEffect(() => {
        if (!started || gameOver) return;
        const move = setInterval(() => {
          setObstacles(prev => {
            const next = [];
            prev.forEach(o => {
              const speed = 1.1 + scoreRef.current * 0.012;
              const y = o.y + speed;
              if (y > 100) return;
              const hit = y > 84 && Math.abs(o.x - posRef.current) < 12;
              if (hit) {
                const newLives = Math.max(0, livesRef.current - 1);
                setLives(newLives);
                if (newLives <= 0) {
                  setGameOver(true);

                return;

              next.push({ ...o, y });

              <div className="flex items-center gap-1 mt-1.5">
                {[0,1,2].map(i => (
                  <span key={i} className="text-lg" style={{ opacity:i<lives?1:.15, filter:i<lives?'drop-shadow(0 0 5px #ff7799)':'none', transition:'opacity .3s' }}>🍭</span>
                ))}

            <div className="text-right">
              <p className="score-text text-3xl font-black">{score}</p>

               onPointerDown={(e) => { setActive(true); setX(e.clientX); }}
               onPointerMove={handleMove}
               onPointerUp={() => setActive(false)}
               onPointerLeave={() => setActive(false)}
               onTouchStart={(e) => { setActive(true); setX(e.touches[0]?.clientX); }}
               onTouchMove={(e) => { handleMove(e); }}
               onTouchEnd={() => setActive(false)}>
            <div className="absolute left-0 right-0 top-0 h-20" style={{ background:'radial-gradient(circle at 50% 20%,rgba(255,255,255,0.22),transparent 70%)' }}/>

                        className="rounded-full px-10 py-4 text-xl font-black text-white"
                        style={{ background:'linear-gradient(135deg,#38d4ff,#7f5cff)', boxShadow:'0 0 30px #38d4ff,0 0 60px #7f5cff', fontFamily:'Orbitron,sans-serif' }}>
                  JOUER ▶
                </button>
              </div>
            )}

            {gameOver && (
              <div className="fixed inset-0 flex flex-col items-center justify-center z-50" style={{ background:'rgba(18,3,33,.92)', backdropFilter:'blur(4px)' }}>
                <p className="text-5xl mb-3">😵</p>
                <h2 className="font-black mb-3 text-center" style={{ fontFamily:'Orbitron,sans-serif', fontSize:'1.9rem', color:'#38d4ff', textShadow:'0 0 20px #38d4ff' }}>TU AS ÉTÉ ATTRAPÉ</h2>
                <p className="score-text font-black mb-1" style={{ fontSize:'2.4rem' }}>{score}</p>
                <p className="text-slate-400 mb-6" style={{ fontFamily:'Orbitron,sans-serif', fontSize:'.68rem', letterSpacing:'.08em' }}>Retourne au menu ou recommence.</p>
                <button onClick={reset}
