              className="rounded-2xl text-2xl text-white font-black" style={{ padding:'14px 0', background:'linear-gradient(135deg,#0ea5e9,#22d3ee)', boxShadow:'0 0 20px rgba(14,165,233,.5)', userSelect:'none' }}>◄◄</button>
            <button onPointerDown={()=>{movR.current=true;}} onPointerUp={()=>{movR.current=false;}} onPointerLeave={()=>{movR.current=false;}} onTouchStart={(e)=>{e.preventDefault();movR.current=true;}} onTouchEnd={()=>{movR.current=false;}}
              className="rounded-2xl text-2xl text-white font-black" style={{ padding:'14px 0', background:'linear-gradient(135deg,#0ea5e9,#22d3ee)', boxShadow:'0 0 20px rgba(14,165,233,.5)', userSelect:'none' }}>►►</button>
          </div>
        </div>
      );
    }

    // ── Canon Break ──────────────────────────────────────────────────────────
    function CannonBreak({ onBack }) {
      /*
       * Physique : test cercle / rectangle par point-le-plus-proche.
       * Pour chaque bloc, on calcule le point du rectangle le plus proche
       * du centre de la balle, puis on mesure la distance. Si elle est
       * inférieure au rayon, il y a collision. La face touchée est déduite
       * de la position du point le plus proche sur le rectangle.
       * Cela élimine toute ambiguïté de coin et tout calcul d'overlap.
       */
      const GW=360,GH=560,BR=9,PH=12,MAX_SPD=8;
      const BH=18,BGAP=22,BCOLS=8,BW=Math.floor((GW-16)/BCOLS);
      const BNUS={wide:{color:'#00ff88',icon:'⚓'},life:{color:'#ff2244',icon:'❤️'}};
      const LNAMES=['GRILLE','PYRAMIDE','DAMIER','VAGUES','BOSS'];

      const cvsRef=useRef(null),gRef=useRef(null),rafRef=useRef(null);
      const movRef=useRef(0),phsRef=useRef('menu');
      const [phase,setPhase]=useState('menu');
      const [uiSc,setUiSc]=useState(0);
      const [uiHp,setUiHp]=useState(3);
      const [uiLv,setUiLv]=useState(1);
      const [won,setWon]=useState(false);

      /* ── helpers ── */
      function mkBall(x,y){
        const a=-Math.PI/2+(Math.random()-.5)*0.75;
        return{x,y,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5};
      }
      function mkBlk(x,y,hp,col,pts,bon){
        return{x,y,w:BW-4,h:BH,hp,maxHp:hp,color:col,pts,bonus:bon||null};
      }

      /* ── niveaux ── */
      function buildLevel(n){
        const sy=50,S=BH+BGAP,bs=[];
        const defs=[
          [['#aa44ff',30,2,null],['#ff3344',20,2,null],['#00cc66',15,1,'wide'],['#22aaff',12,1,null],['#ffcc00',10,1,'life']],
          [['#ff0055',45,3,null],['#aa44ff',35,2,null],['#ff3344',22,2,null],['#00cc66',16,1,'wide'],['#ffcc00',12,1,'life']],
          [['#ff0055',55,3,null],['#aa44ff',42,3,null],['#ff3344',28,2,null],['#00cc66',20,2,'wide'],['#22aaff',15,1,null],['#ffcc00',10,1,'life']],
          [['#ff0055',65,4,null],['#aa44ff',50,3,null],['#ff3344',35,3,null],['#00cc66',22,2,'wide'],['#22aaff',16,2,null],['#ffcc00',12,1,'life']],
          [['#ff0055',80,4,null],['#aa44ff',60,4,null],['#ff3344',45,3,null],['#ff8800',30,3,null],['#00cc66',20,2,'wide'],['#22aaff',14,2,null],['#ffcc00',10,1,'life']],
        ];
        defs[Math.min(n,4)].forEach(([c,p,h,b],r)=>{
          for(let cl=0;cl<BCOLS;cl++)bs.push(mkBlk(8+cl*BW,sy+r*S,h,c,p,b));
        });
        return bs;
      }

      function startLevel(n,sc,hp){
        const pad={x:(GW-100)/2,y:GH-50,w:100};
        gRef.current={
          lv:n,score:sc||0,lives:hp||3,
          balls:[mkBall(GW/2,GH-80)],
          pad,
          blocks:buildLevel(n),
          drops:[],
          spawned:new Set(),
        };
        phsRef.current='play';
        setPhase('play');setUiSc(sc||0);setUiHp(hp||3);setUiLv(n+1);
      }
      function newGame(){setWon(false);startLevel(0,0,3);}

      /* ── collision cercle/bloc ──────────────────────────────────────────
       * Point le plus proche du centre de la balle sur le rectangle.
       * Si distance < BR → collision.
       * La face touchée est déduite du point le plus proche.
       * ---------------------------------------------------------------- */
      function resolveBlock(b,bl){
        // Point le plus proche du centre (b.x,b.y) sur le rect bl
        const cpx=Math.max(bl.x,Math.min(b.x,bl.x+bl.w));
        const cpy=Math.max(bl.y,Math.min(b.y,bl.y+bl.h));
        const dx=b.x-cpx, dy=b.y-cpy;
        const d2=dx*dx+dy*dy;
        if(d2>=BR*BR)return false;          // pas de collision

        const d=Math.sqrt(d2);
        if(d<0.001){
          // Centre de la balle à l'intérieur du bloc : cas dégénéré
          // On pousse la balle vers l'arrière selon sa vitesse
          const sp=Math.hypot(b.vx,b.vy)||1;
          b.x-=b.vx/sp*BR; b.y-=b.vy/sp*BR;
          b.vx=-b.vx; b.vy=-b.vy;
        }else{
          // Push-out : on déplace la balle le long de la normale
          const ov=BR-d;
          b.x+=dx/d*ov; b.y+=dy/d*ov;
          // Rebond selon la face touchée
          if(cpx===bl.x)          b.vx=-Math.abs(b.vx); // face gauche
          else if(cpx===bl.x+bl.w)b.vx= Math.abs(b.vx); // face droite
          if(cpy===bl.y)          b.vy=-Math.abs(b.vy); // face haute
          else if(cpy===bl.y+bl.h)b.vy= Math.abs(b.vy); // face basse
        }
        // Plafond de vitesse
        const sp=Math.hypot(b.vx,b.vy);
        if(sp>MAX_SPD){b.vx=b.vx/sp*MAX_SPD;b.vy=b.vy/sp*MAX_SPD;}
        return true;
      }

      /* ── update ── */
      function update(){
        const g=gRef.current;if(!g)return;
        // Palette
        if(movRef.current<0)g.pad.x=Math.max(0,g.pad.x-6);
        if(movRef.current>0)g.pad.x=Math.min(GW-g.pad.w,g.pad.x+6);
        // Bonus tombants
        g.drops=g.drops.filter(d=>{
          d.y+=2.5;
          if(d.y>=g.pad.y&&d.y<=g.pad.y+PH&&d.x>=g.pad.x&&d.x<=g.pad.x+g.pad.w){
            playEat();
            if(d.type==='wide')g.pad.w=Math.min(220,g.pad.w+50);
            if(d.type==='life'){g.lives=Math.min(5,g.lives+1);setUiHp(g.lives);}
            return false;
          }
          return d.y<GH+20;
        });
        // Balles
        const alive=[];let anyLost=false;
        g.balls.forEach(b=>{
          // Garde-fou NaN
          if(!isFinite(b.x)||!isFinite(b.y)||!isFinite(b.vx)||!isFinite(b.vy)){
            b.x=g.pad.x+g.pad.w/2;b.y=g.pad.y-BR-2;b.vx=3;b.vy=-4;
          }
          b.x+=b.vx; b.y+=b.vy;
          // Murs
          if(b.x-BR<0){b.x=BR;b.vx=Math.abs(b.vx);}
          if(b.x+BR>GW){b.x=GW-BR;b.vx=-Math.abs(b.vx);}
          if(b.y-BR<0){b.y=BR;b.vy=Math.abs(b.vy);}
          // Palette
          if(b.vy>0&&b.y+BR>=g.pad.y&&b.y-BR<=g.pad.y+PH
             &&b.x>g.pad.x-4&&b.x<g.pad.x+g.pad.w+4){
            b.y=g.pad.y-BR;
            const t=Math.max(0,Math.min(1,(b.x-g.pad.x)/g.pad.w));
            const a=(t-.5)*(Math.PI*0.65);
            const sp=Math.hypot(b.vx,b.vy);
            b.vx=Math.sin(a)*sp;
            b.vy=-Math.abs(Math.cos(a)*sp);
          }
          // Blocs (test cercle/rectangle)
          for(let i=g.blocks.length-1;i>=0;i--){
            if(resolveBlock(b,g.blocks[i])){
              const bl=g.blocks[i];
              bl.hp--;
              if(bl.hp<=0){
                const bon=(bl.bonus&&BNUS[bl.bonus]&&!g.spawned.has(bl.bonus))
                          ?bl.bonus:null;
                if(bon){
                  g.drops.push({x:bl.x+bl.w/2,y:bl.y+bl.h/2,type:bon});
                  g.spawned.add(bon);
                }
                g.score+=bl.pts;
                setUiSc(g.score);
                playEat();
                g.blocks.splice(i,1);
              }
              break;
            }
          }
          if(!isFinite(b.y)||b.y-BR>GH){anyLost=true;return;}
          alive.push(b);
        });
        g.balls=alive;
        if(anyLost&&g.balls.length===0){
          g.lives--;setUiHp(g.lives);playMiss();
          if(g.lives<=0){phsRef.current='over';setPhase('over');return;}
          g.balls=[mkBall(g.pad.x+g.pad.w/2,g.pad.y-BR-2)];
        }
        if(g.blocks.length===0){
          if(g.lv<4){phsRef.current='next';setPhase('next');}
          else{phsRef.current='over';setWon(true);setPhase('over');}
        }
      }

      /* ── draw ── */
      function draw(){
        const canvas=cvsRef.current;if(!canvas)return;
        const ctx=canvas.getContext('2d'),g=gRef.current;
        const bg=ctx.createLinearGradient(0,0,0,GH);
        bg.addColorStop(0,'#0a1628');bg.addColorStop(1,'#041018');
        ctx.fillStyle=bg;ctx.fillRect(0,0,GW,GH);
        if(!g)return;
        try{
          g.blocks.forEach(bl=>{
            const clr=bl.hp<bl.maxHp?bl.color+'99':bl.color;
            ctx.save();ctx.shadowColor=clr;ctx.shadowBlur=12;
            const gr=ctx.createLinearGradient(bl.x,bl.y,bl.x,bl.y+bl.h);
            gr.addColorStop(0,clr+'ee');gr.addColorStop(1,clr+'55');
            ctx.fillStyle=gr;rrect(ctx,bl.x,bl.y,bl.w,bl.h,4);ctx.fill();
            ctx.strokeStyle=clr+'88';ctx.lineWidth=1;ctx.stroke();
            if(bl.maxHp>1){
              ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 9px sans-serif';
              ctx.textAlign='center';ctx.textBaseline='middle';
              ctx.fillText(bl.hp,bl.x+bl.w/2,bl.y+bl.h/2);
            }
            ctx.restore();
          });
        }catch(e){}
        try{
          g.drops.forEach(d=>{
            const bn=BNUS[d.type];if(!bn)return;
            ctx.save();ctx.shadowColor=bn.color;ctx.shadowBlur=12;
            ctx.fillStyle=bn.color+'cc';ctx.beginPath();ctx.arc(d.x,d.y,10,0,Math.PI*2);ctx.fill();
            ctx.restore();
            ctx.font='10px serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(bn.icon,d.x,d.y);
          });
        }catch(e){}
        try{
          ctx.save();ctx.shadowColor='#22d3ee';ctx.shadowBlur=20;
          const pg=ctx.createLinearGradient(g.pad.x,g.pad.y,g.pad.x,g.pad.y+PH);
          pg.addColorStop(0,'#38e8ff');pg.addColorStop(1,'#0ea5e9');
          ctx.fillStyle=pg;rrect(ctx,g.pad.x,g.pad.y,g.pad.w,PH,6);ctx.fill();
          ctx.restore();
        }catch(e){}
        try{
          g.balls.forEach(b=>{
            if(!isFinite(b.x)||!isFinite(b.y))return;
            ctx.save();ctx.shadowColor='#fffbeb';ctx.shadowBlur=20;
            const bg2=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,BR);
            bg2.addColorStop(0,'#fff');bg2.addColorStop(.5,'#ccc');bg2.addColorStop(1,'#555');
            ctx.fillStyle=bg2;ctx.beginPath();ctx.arc(b.x,b.y,BR,0,Math.PI*2);ctx.fill();
            ctx.restore();
          });
        }catch(e){}
      }

      /* ── boucle RAF ── */
      useEffect(()=>{
        if(phase!=='play')return;
        let last=0;
        const loop=(t)=>{
          if(phsRef.current!=='play')return;
          try{if(t-last>=16){last=t;update();draw();}}
          catch(e){console.error('CB:',e);try{draw();}catch(_){}}
          rafRef.current=requestAnimationFrame(loop);
        };
        rafRef.current=requestAnimationFrame(loop);
        return()=>{cancelAnimationFrame(rafRef.current);};
      },[phase]);
      useEffect(()=>{draw();},[]);

      /* ── UI ── */
      return (
        <div className="w-full flex flex-col items-center px-3 py-2 select-none overflow-hidden"
             style={{height:'100dvh',background:'radial-gradient(circle at 30% 10%,#0a3060 0%,#041018 60%)',position:'relative'}}>
          <div className="blob" style={{width:200,height:200,background:'#1155aa',top:-60,left:-50}}/>
          <div className="blob" style={{width:160,height:160,background:'#ffd700',bottom:80,right:-40,animationDelay:'4s'}}/>

          <div className="w-full max-w-full lg:max-w-3xl flex items-center justify-between mb-1 z-10" style={{flexShrink:0}}>
            <div className="flex items-center gap-3">
              <button onClick={onBack} style={{fontFamily:'Orbitron,sans-serif',fontSize:'.58rem',color:'#666',border:'1px solid rgba(255,255,255,0.08)',background:'rgba(255,255,255,0.03)',borderRadius:'8px',padding:'4px 10px',cursor:'pointer'}}>← MENU</button>
              <div>
                <h1 className="font-black tracking-widest" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.1rem',color:'#ffd700',textShadow:'0 0 10px #ffd700'}}>CANON BREAK</h1>
                <div className="flex items-center gap-1 mt-0.5">
                  {[0,1,2,3,4].map(i=><span key={i} style={{fontSize:'.9rem',opacity:i<uiHp?1:.15,filter:i<uiHp?'drop-shadow(0 0 5px #ff2244)':'none',transition:'opacity .3s'}}>❤️</span>)}
                </div>
              </div>
            </div>
            <div className="text-right">
              <p className="score-text font-black" style={{fontSize:'1.6rem',lineHeight:1}}>{uiSc}</p>
              <div style={{fontFamily:'Orbitron,sans-serif',fontSize:'.55rem',fontWeight:900,color:'#ffd700'}}>NV {uiLv} · {LNAMES[uiLv-1]||''}</div>
            </div>
          </div>

          <div className="relative w-full max-w-full lg:max-w-3xl rounded-2xl overflow-hidden z-10" style={{flex:1,minHeight:0}}>
            <canvas ref={cvsRef} width={GW} height={GH} style={{width:'100%',height:'100%',display:'block',touchAction:'none'}}/>
            {phase==='menu'&&(
              <div className="absolute inset-0 flex flex-col items-center justify-center z-20" style={{background:'rgba(4,16,24,.92)',backdropFilter:'blur(4px)'}}>
                <p className="text-5xl mb-3">💣</p>
                <h2 className="font-black mb-2 tracking-widest" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.8rem',color:'#ffd700',textShadow:'0 0 20px #ffd700'}}>CANON BREAK</h2>
                <p className="text-slate-300 text-center text-sm mb-3 px-8 leading-relaxed">Détruis tous les blocs !<br/>5 niveaux — Grille · Pyramide · Damier · Vagues · Boss</p>
                <div className="grid grid-cols-2 gap-x-6 gap-y-1 mb-4 text-center" style={{fontSize:'.65rem',fontFamily:'Orbitron,sans-serif'}}>
                  <span style={{color:'#00ff88'}}>⚓ Barque large</span>
                  <span style={{color:'#ff2244'}}>❤️ +1 vie</span>
                </div>
                <button onClick={newGame} className="rounded-full px-10 py-4 text-xl font-black text-black" style={{background:'linear-gradient(135deg,#ffd700,#ff8800)',boxShadow:'0 0 30px #ffd700',fontFamily:'Orbitron,sans-serif'}}>JOUER ▶</button>
              </div>
            )}
            {phase==='next'&&(
              <div className="absolute inset-0 flex flex-col items-center justify-center z-20" style={{background:'rgba(4,16,24,.94)',backdropFilter:'blur(4px)'}}>
                <p className="text-5xl mb-2">🏅</p>
                <h2 className="font-black mb-1 tracking-widest" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.5rem',color:'#ffd700',textShadow:'0 0 20px #ffd700'}}>NIVEAU TERMINÉ !</h2>
                <p className="font-black mb-3" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1rem',color:'#00ff88'}}>{LNAMES[uiLv]||'BOSS'}</p>
                <p className="score-text font-black mb-4" style={{fontSize:'2rem'}}>{uiSc}</p>
                <button onClick={()=>{const g=gRef.current;startLevel(g.lv+1,g.score,g.lives);}} className="rounded-full px-10 py-4 text-xl font-black text-black" style={{background:'linear-gradient(135deg,#ffd700,#ff8800)',boxShadow:'0 0 30px #ffd700',fontFamily:'Orbitron,sans-serif'}}>CONTINUER ▶</button>
              </div>
            )}
            {phase==='over'&&(
              <div className="absolute inset-0 flex flex-col items-center justify-center z-20" style={{background:'rgba(4,16,24,.94)',backdropFilter:'blur(4px)'}}>
                <p className="text-4xl mb-3">{won?'🏆':'💥'}</p>
                <h2 className="font-black mb-2" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.9rem',color:won?'#ffd700':'#ff4444',textShadow:`0 0 20px ${won?'#ffd700':'#ff4444'}`}}>{won?'VICTOIRE !':'NAUFRAGE !'}</h2>
                <p className="score-text font-black mb-4" style={{fontSize:'2.4rem'}}>{uiSc}</p>
                <button onClick={newGame} className="rounded-full px-10 py-4 text-xl font-black text-black" style={{background:'linear-gradient(135deg,#ffd700,#ff8800)',boxShadow:'0 0 30px #ffd700',fontFamily:'Orbitron,sans-serif'}}>REJOUER ▶</button>
              </div>
            )}
          </div>

          <div className="w-full max-w-full lg:max-w-3xl mt-2 mb-2 z-10 grid grid-cols-2 gap-2" style={{flexShrink:0}}>
            <button onPointerDown={()=>{movRef.current=-1;}} onPointerUp={()=>{movRef.current=0;}} onPointerLeave={()=>{movRef.current=0;}} onTouchStart={(e)=>{e.preventDefault();movRef.current=-1;}} onTouchEnd={()=>{movRef.current=0;}}
              className="rounded-2xl text-2xl text-white font-black" style={{padding:'14px 0',background:'linear-gradient(135deg,#ffd700,#ff8800)',boxShadow:'0 0 20px rgba(255,215,0,.5)',userSelect:'none'}}>◄◄</button>
            <button onPointerDown={()=>{movRef.current=1;}} onPointerUp={()=>{movRef.current=0;}} onPointerLeave={()=>{movRef.current=0;}} onTouchStart={(e)=>{e.preventDefault();movRef.current=1;}} onTouchEnd={()=>{movRef.current=0;}}
              className="rounded-2xl text-2xl text-white font-black" style={{padding:'14px 0',background:'linear-gradient(135deg,#ffd700,#ff8800)',boxShadow:'0 0 20px rgba(255,215,0,.5)',userSelect:'none'}}>►►</button>
          </div>
        </div>
      );
    }

        // ── Fuite Féline ─────────────────────────────────────────────────────────
    function ChatTraque({ onBack }) {
      const GW=360,GH=456,TILE=24,COLS=15,ROWS=19,INVINC=120;
      const CAT_SPD=2.5;

      const cvsRef=useRef(null),gRef=useRef(null),rafRef=useRef(null);
      const dirRef=useRef([0,0]);
      const phsRef=useRef('menu');
      const [phase,setPhase]=useState('menu');
      const [uiTime,setUiTime]=useState(0);
      const [uiLives,setUiLives]=useState(3);
      const [best,setBest]=useState(()=>+(localStorage.getItem('ft_best')||0));

      function tp(t){return t*TILE+TILE/2;}

      function genMaze(){
        const m=Array.from({length:ROWS},()=>new Array(COLS).fill(0));
        const stk=[[1,1]];m[1][1]=1;
        while(stk.length){
          const[cx,cy]=stk[stk.length-1];
          const nb=[];
          for(const[dx,dy] of [[0,-2],[0,2],[-2,0],[2,0]]){
            const nx=cx+dx,ny=cy+dy;
            if(nx>0&&nx<COLS-1&&ny>0&&ny<ROWS-1&&m[ny][nx]===0)nb.push([nx,ny,dx,dy]);
          }
          if(nb.length){const[nx,ny,dx,dy]=nb[Math.floor(Math.random()*nb.length)];m[cy+dy/2][cx+dx/2]=1;m[ny][nx]=1;stk.push([nx,ny]);}
          else stk.pop();
        }
        // Boucles supplémentaires : ouvre ~12% des murs horizontaux internes
        for(let y=2;y<ROWS-1;y+=2)
          for(let x=1;x<COLS-1;x+=2)
            if(m[y][x]===0&&Math.random()<0.12)m[y][x]=1;
        return m;
      }

      function bfs(maze,sx,sy,gx,gy){
        if(sx===gx&&sy===gy)return[];
        const q=[[sx,sy]],prev=new Map([[`${sx},${sy}`,null]]);
        while(q.length){
          const[cx,cy]=q.shift();
          if(cx===gx&&cy===gy)break;
          for(const[dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
            const nx=cx+dx,ny=cy+dy,k=`${nx},${ny}`;
            if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&maze[ny][nx]===1&&!prev.has(k)){prev.set(k,[cx,cy]);q.push([nx,ny]);}
          }
        }
        if(!prev.has(`${gx},${gy}`))return[];
        const path=[];let cur=[gx,gy];
        while(cur&&!(cur[0]===sx&&cur[1]===sy)){path.unshift([...cur]);cur=prev.get(`${cur[0]},${cur[1]}`);}
        return path;
      }

      function mkDog(tx,ty,spd){
        return{tx,ty,x:tp(tx),y:tp(ty),targetX:tp(tx),targetY:tp(ty),moving:false,path:[],ptimer:30+Math.floor(Math.random()*20),speed:spd};
      }

      function startGame(){
        const maze=genMaze();
        const cat={tx:1,ty:1,x:tp(1),y:tp(1),targetX:tp(1),targetY:tp(1),moving:false,invinc:INVINC};
        gRef.current={maze,cat,dogs:[mkDog(13,17,1.1)],ticks:0,lives:3,nextSpawn:15*60,dogCount:1,flash:0};
        phsRef.current='play';setPhase('play');setUiTime(0);setUiLives(3);dirRef.current=[0,0];
      }

      function update(){
        const g=gRef.current;if(!g)return;
        g.ticks++;
        if(g.ticks%60===0)setUiTime(Math.floor(g.ticks/60));

        // Nouveau chien toutes les 15 secondes (max 4)
        if(g.dogCount<4&&g.ticks>=g.nextSpawn){
          const spawns=[[1,17,1.25],[13,1,1.4],[7,17,1.55]];
          const sp=spawns[g.dogCount-1];
          if(sp){g.dogs.push(mkDog(sp[0],sp[1],sp[2]));g.flash=25;}
          g.dogCount++;g.nextSpawn+=15*60;
        }
        if(g.flash>0)g.flash--;

        // Mouvement du chat
        const cat=g.cat;
        if(cat.invinc>0)cat.invinc--;
        if(!cat.moving){
          const[dx,dy]=dirRef.current;
          if(dx||dy){
            const ntx=cat.tx+dx,nty=cat.ty+dy;
            if(ntx>=0&&ntx<COLS&&nty>=0&&nty<ROWS&&g.maze[nty][ntx]===1){
              cat.tx=ntx;cat.ty=nty;cat.targetX=tp(ntx);cat.targetY=tp(nty);cat.moving=true;
            }
          }
        }else{
          const dx=cat.targetX-cat.x,dy=cat.targetY-cat.y,d=Math.hypot(dx,dy);
          if(d<=CAT_SPD){cat.x=cat.targetX;cat.y=cat.targetY;cat.moving=false;}
          else{cat.x+=dx/d*CAT_SPD;cat.y+=dy/d*CAT_SPD;}
        }

        // Déplacement + IA des chiens
        let caught=false;
        g.dogs.forEach(dog=>{
          dog.ptimer--;
          if(dog.ptimer<=0){
            dog.ptimer=40+Math.floor(Math.random()*25);
            if(Math.random()<0.78){
              dog.path=bfs(g.maze,dog.tx,dog.ty,cat.tx,cat.ty);
            }else{
              // Déambulation aléatoire
              const opts=[[0,1],[0,-1],[1,0],[-1,0]].filter(([dx,dy])=>{
                const nx=dog.tx+dx,ny=dog.ty+dy;
                return nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&g.maze[ny][nx]===1;
              });
              if(opts.length){const o=opts[Math.floor(Math.random()*opts.length)];dog.path=[[dog.tx+o[0],dog.ty+o[1]]];}
            }
          }
          if(!dog.moving&&dog.path.length>0){
            const[ntx,nty]=dog.path.shift();
            dog.tx=ntx;dog.ty=nty;dog.targetX=tp(ntx);dog.targetY=tp(nty);dog.moving=true;
          }
          if(dog.moving){
            const dx=dog.targetX-dog.x,dy=dog.targetY-dog.y,d=Math.hypot(dx,dy);
            if(d<=dog.speed){dog.x=dog.targetX;dog.y=dog.targetY;dog.moving=false;}
            else{dog.x+=dx/d*dog.speed;dog.y+=dy/d*dog.speed;}
          }
          // Collision chat/chien
          if(!caught&&cat.invinc===0&&Math.hypot(dog.x-cat.x,dog.y-cat.y)<TILE*0.7){
            caught=true;
            cat.invinc=INVINC;
            g.lives--;setUiLives(g.lives);playDie();
            if(g.lives<=0){
              const secs=Math.floor(g.ticks/60);setUiTime(secs);
              if(secs>+(localStorage.getItem('ft_best')||0)){localStorage.setItem('ft_best',String(secs));setBest(secs);}
              phsRef.current='over';setPhase('over');
            }else{
              cat.tx=1;cat.ty=1;cat.x=tp(1);cat.y=tp(1);cat.targetX=tp(1);cat.targetY=tp(1);cat.moving=false;
              g.dogs.forEach(d=>{d.path=[];d.ptimer=90;});
            }
          }
        });
      }

      function draw(){
        const canvas=cvsRef.current;if(!canvas)return;
        const ctx=canvas.getContext('2d'),g=gRef.current;
        ctx.fillStyle='#030318';ctx.fillRect(0,0,GW,GH);
        if(!g)return;
        // Tuiles du labyrinthe
        for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
          if(g.maze[y][x]===0){
            ctx.fillStyle='#161650';ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
            ctx.fillStyle='rgba(60,60,180,0.18)';ctx.fillRect(x*TILE+2,y*TILE+2,TILE-4,TILE-4);
          }else{
            ctx.fillStyle='#07071c';ctx.fillRect(x*TILE,y*TILE,TILE,TILE);
          }
        }
        // Grille légère sur les couloirs
        ctx.strokeStyle='rgba(40,40,120,0.35)';ctx.lineWidth=0.4;
        for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(GW,y*TILE);ctx.stroke();}
        for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,GH);ctx.stroke();}
        // Vignette danger (rouge quand un chien est proche)
        const minD=g.dogs.reduce((m,d)=>Math.min(m,Math.hypot(d.x-g.cat.x,d.y-g.cat.y)),9999);
        if(minD<TILE*5){
          const a=(1-minD/(TILE*5))*0.32;
          const vg=ctx.createRadialGradient(GW/2,GH/2,GH*0.2,GW/2,GH/2,GH*0.75);
          vg.addColorStop(0,'rgba(220,0,0,0)');vg.addColorStop(1,`rgba(220,0,0,${a})`);
          ctx.fillStyle=vg;ctx.fillRect(0,0,GW,GH);
        }
        // Chiens
        ctx.textAlign='center';ctx.textBaseline='middle';
        g.dogs.forEach(dog=>{
          ctx.save();ctx.shadowColor='#ff4400';ctx.shadowBlur=16;
          ctx.font=`${TILE+2}px serif`;ctx.fillText('🐕',dog.x,dog.y+2);
          ctx.restore();
        });
        // Chat (clignote pendant l'invincibilité)
        const cat=g.cat;
        if(cat.invinc===0||Math.floor(cat.invinc/8)%2===0){
          ctx.save();ctx.shadowColor='#44ddff';ctx.shadowBlur=16;
          ctx.font=`${TILE+2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('🐱',cat.x,cat.y+2);
          ctx.restore();
        }
        // Flash d'alerte (nouveau chien)
        if(g.flash>0){
          ctx.fillStyle=`rgba(255,80,0,${g.flash/25*0.4})`;ctx.fillRect(0,0,GW,GH);
          if(g.flash>12){
            ctx.save();ctx.font='bold 15px Orbitron,sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffbb44';
            ctx.shadowColor='#ff6600';ctx.shadowBlur=18;
            ctx.fillText('🐕  UN NOUVEAU CHIEN !',GW/2,GH/2);ctx.restore();
          }
        }
      }

      useEffect(()=>{
        if(phase!=='play')return;
        let last=0;
        const loop=(t)=>{
          if(phsRef.current!=='play')return;
          try{if(t-last>=16){last=t;update();draw();}}catch(e){console.error('FF:',e);try{draw();}catch(_){}}
          rafRef.current=requestAnimationFrame(loop);
        };
        rafRef.current=requestAnimationFrame(loop);
        return()=>{cancelAnimationFrame(rafRef.current);};
      },[phase]);
      useEffect(()=>{draw();},[]);

      const btnStyle={background:'linear-gradient(135deg,#5b21b6,#1d4ed8)',boxShadow:'0 0 12px rgba(109,40,217,.55)',borderRadius:'14px',border:'none',color:'white',fontSize:'1.3rem',fontWeight:900,cursor:'pointer',userSelect:'none',touchAction:'none',display:'flex',alignItems:'center',justifyContent:'center'};
      function dBtn(d,lbl){return{onPointerDown:(e)=>{e.preventDefault();dirRef.current=d;},onPointerUp:()=>{dirRef.current=[0,0];},onPointerLeave:()=>{dirRef.current=[0,0];},onTouchStart:(e)=>{e.preventDefault();dirRef.current=d;},onTouchEnd:()=>{dirRef.current=[0,0];},style:btnStyle,children:lbl};}

      return (
        <div className="w-full flex flex-col items-center px-3 py-2 select-none overflow-hidden"
             style={{height:'100dvh',background:'radial-gradient(circle at 50% 15%,#0d0050 0%,#030310 65%)',position:'relative'}}>
          <div className="blob" style={{width:200,height:200,background:'#7700ff',top:-60,left:-50}}/>
          <div className="blob" style={{width:150,height:150,background:'#003bff',bottom:60,right:-30,animationDelay:'5s'}}/>

          {/* En-tête */}
          <div className="w-full max-w-full flex items-center justify-between mb-1 z-10" style={{flexShrink:0}}>
            <div className="flex items-center gap-3">
              <button onClick={onBack} style={{fontFamily:'Orbitron,sans-serif',fontSize:'.58rem',color:'#666',border:'1px solid rgba(255,255,255,0.08)',background:'rgba(255,255,255,0.03)',borderRadius:'8px',padding:'4px 10px',cursor:'pointer'}}>← MENU</button>
              <div>
                <h1 className="font-black tracking-widest" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1rem',color:'#bb88ff',textShadow:'0 0 10px #7700ff'}}>FUITE FÉLINE</h1>
                <div className="flex items-center gap-0.5 mt-0.5">
                  {[0,1,2].map(i=><span key={i} style={{fontSize:'.85rem',opacity:i<uiLives?1:.15,filter:i<uiLives?'drop-shadow(0 0 5px #ff2244)':'none',transition:'opacity .3s'}}>❤️</span>)}
                </div>
              </div>
            </div>
            <div className="text-right">
              <p className="font-black" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.6rem',lineHeight:1,color:'#ffd700',textShadow:'0 0 12px #ffd700'}}>{uiTime}<span style={{fontSize:'.7rem'}}>s</span></p>
              <div style={{fontFamily:'Orbitron,sans-serif',fontSize:'.48rem',color:'#666'}}>RECORD : {best}s</div>
            </div>
          </div>

          {/* Canvas */}
          <div className="relative w-full rounded-2xl overflow-hidden z-10" style={{flex:1,minHeight:0}}>
            <canvas ref={cvsRef} width={GW} height={GH} style={{width:'100%',height:'100%',display:'block',touchAction:'none'}}/>
            {phase==='menu'&&(
              <div className="absolute inset-0 flex flex-col items-center justify-center z-20" style={{background:'rgba(2,2,18,.93)',backdropFilter:'blur(4px)'}}>
                <p className="text-5xl mb-2">🐱</p>
                <h2 className="font-black mb-1 tracking-widest" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.55rem',color:'#bb88ff',textShadow:'0 0 20px #7700ff'}}>FUITE FÉLINE</h2>
                <p className="text-slate-300 text-center text-sm mb-3 px-8 leading-relaxed">Guide le chat dans le labyrinthe.<br/>Échappe aux chiens le plus longtemps !</p>
                <div className="flex gap-6 mb-4 text-center">
                  <div><span className="text-2xl">🐕</span><br/><span style={{fontSize:'.6rem',color:'#ff9988'}}>Te traque</span></div>
                  <div><span className="text-2xl">⏱️</span><br/><span style={{fontSize:'.6rem',color:'#ffcc44'}}>+1 chien/15s</span></div>
                  <div><span className="text-2xl">❤️</span><br/><span style={{fontSize:'.6rem',color:'#ff4466'}}>3 vies</span></div>
                </div>
                <button onClick={startGame} className="rounded-full px-10 py-4 text-xl font-black text-white" style={{background:'linear-gradient(135deg,#7700ff,#1d4ed8)',boxShadow:'0 0 30px #7700ff',fontFamily:'Orbitron,sans-serif'}}>JOUER ▶</button>
              </div>
            )}
            {phase==='over'&&(
              <div className="absolute inset-0 flex flex-col items-center justify-center z-20" style={{background:'rgba(2,2,18,.94)',backdropFilter:'blur(4px)'}}>
                <p className="text-5xl mb-2">😿</p>
                <h2 className="font-black mb-2" style={{fontFamily:'Orbitron,sans-serif',fontSize:'1.9rem',color:'#ff4444',textShadow:'0 0 20px #ff0000'}}>CAPTURÉ !</h2>
                <p style={{fontFamily:'Orbitron,sans-serif',fontSize:'.7rem',color:'#aa88ff',marginBottom:'4px'}}>SURVIE</p>
                <p className="font-black" style={{fontFamily:'Orbitron,sans-serif',fontSize:'2.6rem',color:'#ffd700',textShadow:'0 0 20px #ffd700',lineHeight:1}}>{uiTime}<span style={{fontSize:'1.2rem'}}>s</span></p>
                <p style={{fontFamily:'Orbitron,sans-serif',fontSize:'.55rem',color:'#666',margin:'6px 0 20px'}}>RECORD : {best}s</p>
                <button onClick={startGame} className="rounded-full px-10 py-4 text-xl font-black text-white" style={{background:'linear-gradient(135deg,#7700ff,#1d4ed8)',boxShadow:'0 0 30px #7700ff',fontFamily:'Orbitron,sans-serif'}}>REJOUER ▶</button>
              </div>
            )}
          </div>

          {/* Croix directionnelle */}
          <div className="z-10 mt-2 mb-1" style={{flexShrink:0}}>
            <div style={{display:'grid',gridTemplateColumns:'56px 56px 56px',gridTemplateRows:'48px 48px 48px',gap:'5px'}}>
              <div/>
              <button {...dBtn([0,-1],'▲')}/>
              <div/>
              <button {...dBtn([-1,0],'◄')}/>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.6rem',opacity:.6}}>🐱</div>
              <button {...dBtn([1,0],'►')}/>
              <div/>
              <button {...dBtn([0,1],'▼')}/>
              <div/>
            </div>
          </div>
        </div>
      );
    }

    // ── App ───────────────────────────────────────────────────────────────────
    function App() {
      const [screen, setScreen] = useState('menu');
      if (screen === 'menu')     return <MenuScreen onSelect={setScreen}/>;
      if (screen === 'neonbeat') return <RhythmGame onBack={() => setScreen('menu')}/>;
      if (screen === 'snake')    return <SnakeGame  onBack={() => setScreen('menu')}/>;
      if (screen === 'dog')      return <DogGame    onBack={() => setScreen('menu')}/>;
      if (screen === 'candy')       return <CandyGame    onBack={() => setScreen('menu')}/>;
      if (screen === 'pirate')      return <PirateGame   onBack={() => setScreen('menu')}/>;
      if (screen === 'cannonbreak') return <CannonBreak  onBack={() => setScreen('menu')}/>;
      if (screen === 'chattraque')  return <ChatTraque   onBack={() => setScreen('menu')}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
